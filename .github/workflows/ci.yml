name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  usb-hil-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Python syntax across the repository
        run: python3 -m compileall -q Simulacao Front/pico_tui Codigo/scripts Pesquisa
      - name: Validate Bash scripts
        run: find Codigo/scripts Simulacao -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate Studio JavaScript
        run: node --check Simulacao/studio/static/app.js
      - name: Test USB-HIL and native simulator interfaces
        run: python3 -m unittest discover -s Simulacao/tests -v

  tui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Front/pyproject.toml
      - name: Install TUI
        run: python -m pip install -e 'Front[dev]'
      - name: Run tests
        run: pytest Front/tests
      - name: Run native validation tests
        run: ./Codigo/scripts/test_native_firmware.sh

  pico-firmware:
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: /home/runner/pico-sdk
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi python3
      - name: Fetch Pico SDK 2.3.1
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive
      - name: Build Pico W firmware (sem chave de enlace, de propósito)
        run: ./Codigo/scripts/build_pico.sh --sem-chave
      - name: Build Pico W firmware (recusa compilar sem chave)
        run: |
          if ./Codigo/scripts/build_pico.sh pico2_w; then
            echo "o build deveria ter parado por falta de chave" >&2
            exit 1
          fi
      - name: Create CI link key (public test key, never used on hardware)
        run: |
          printf 'EDGE_LINK_MASTER_KEY=%s\nEDGE_SERIAL_ADMIN_TOKEN=0x1122334455667788\n' \
            000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f > .env.local
      - name: Build acoustic sensor firmware (Pico W)
        run: ./Codigo/scripts/build_pico.sh pico_w --audio
      - name: Build acoustic sensor firmware (Pico 2 W, microphone pins overridden)
        run: ./Codigo/scripts/build_pico.sh pico2_w --audio --mic-pins 10,12
      - name: Build Pico W firmware with the sensor waits overridden
        run: |
          ./Codigo/scripts/build_pico.sh pico_w --espera-sessao 7000 --espera-oferta 5000
          ls Codigo/node-wifi/build/pico_w-sess7000-oferta5000/edge_node_firmware.uf2
      - name: Both variants stay on disk (one folder per board)
        run: |
          ls Codigo/node-wifi/build/pico_w/edge_node_firmware.uf2 \
             Codigo/node-audio/build/pico_w/edge_audio_firmware.uf2 \
             Codigo/node-audio/build/pico2_w-mic10-12/edge_audio_firmware.uf2

  esp32-platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build CAN node without link key (de propósito)
        run: ./Codigo/scripts/build_esp32_can_node.sh 1 --sem-chave
      - name: Build refuses a node without link key
        run: |
          if ./Codigo/scripts/build_esp32_can_node.sh 2; then
            echo "o build deveria ter parado por falta de chave" >&2
            exit 1
          fi
      - name: Create CI link key (public test key, never used on hardware)
        run: |
          printf 'EDGE_LINK_MASTER_KEY=%s\n' 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f > .env.local
      - name: Build CAN node with link key
        run: ./Codigo/scripts/build_esp32_can_node.sh 1
      - name: Build CAN node with power measurement (ADC divider and INA219)
        run: PLATFORMIO_BUILD_FLAGS="-D IOT_VIN_ADC_PIN=34 -D IOT_INA219_ADDR=64" ./Codigo/scripts/build_esp32_can_node.sh 1
      - name: Build Probe 00
        run: ./Codigo/scripts/build_esp32_can_node.sh 0
      - name: Build CAN node with command authentication (--auth-can)
        run: ./Codigo/scripts/build_esp32_can_node.sh 1 --auth-can
      - name: Build Probe 00 with command authentication (--auth-can)
        run: ./Codigo/scripts/build_esp32_can_node.sh 0 --auth-can
      - name: Build refuses --auth-can without link key
        run: |
          rm -f .env.local
          if ./Codigo/scripts/build_esp32_can_node.sh 0 --auth-can; then
            echo "o build deveria ter parado por falta de chave" >&2
            exit 1
          fi

  panel-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build panel (ESP32-2432S028, sem chave, somente USB com a bancada virtual)
        run: ./Codigo/scripts/build_paper.sh
      - name: Build panel (ESP32-2432S028, chave de bancada fictícia, Wi-Fi e BLE)
        working-directory: Codigo/node-paper
        env:
          IOT_PANEL_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: pio run -e cyd

  reader-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build documentation reader (M5Stack PaperColor)
        run: ./Codigo/scripts/build_leitor.sh

  research-toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate research toolkit syntax
        run: python3 -m compileall -q Pesquisa
      - name: Test design, statistics, collection and analysis (demonstration campaign on the virtual bench)
        run: python3 -m unittest discover -s Pesquisa/tests -v
      - name: Build Node firmware with research parameters overridden
        run: |
          python -m pip install platformio
          PLATFORMIO_BUILD_FLAGS="-D IOT_ASSOC_STALE_MS=10000 -D IOT_ASSOC_HYSTERESIS_MS=5000" ./Codigo/scripts/build_esp32_can_node.sh 1 --sem-chave