[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-canfd-tui"
version = "0.9.0"
description = "TUI de engenharia para sensor wireless, gateway ESP32 e rede CAN FD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=1.0,<9.0",
  "rich>=13,<16",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
pico-tui = "pico_tui.__main__:main"
can-tui = "pico_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pico_tui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.setuptools.package-data]
pico_tui = ["*.tcss"]
