[platformio]
default_envs = esp32dev-can-node

; Ajuste os pinos em include/node_config.h conforme a placa usada.
;
; board_build.partitions: BLE (NimBLE) + Wi-Fi (ponto de acesso do plano de
;   dados) não cabem na partição de aplicação padrão de 1,3 MB; min_spiffs
;   oferece 1,9 MB e mantém OTA.
; edge_protocol_definitions.h (formato dos payloads do sensor) tem uma única
;   definição, no firmware do Pico W, e é incluído por caminho relativo em
;   src/wireless_link.cpp. Codigo/node-wifi NÃO pode entrar em build_flags
;   com -I: o lwipopts.h do Pico substituiria o do ESP-IDF.
; symlink://../common/ioc_link: HMAC-SHA256, autenticação do enlace e
;   segmentação CAN, compartilhados com o firmware do sensor.
; A chave de enlace é lida de IOT_LINK_MASTER_KEY por tools/node_id.py; os
;   scripts em Codigo/scripts/ a obtêm de .env.local.

[env:esp32dev-can-node]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:tools/node_id.py
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
    -D IOT_OVER_CAN_PLATFORMIO=1
    -Wall
    -Wextra
lib_deps =
    https://github.com/pierremolinaro/acan2515.git
    h2zero/NimBLE-Arduino@^2.5.1
    symlink://../common/ioc_link
