[platformio]
default_envs = esp32dev-can-node

[env:esp32dev-can-node]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:tools/node_id.py
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D IOT_OVER_CAN_PLATFORMIO=1
    -Wall
    -Wextra
lib_deps =
    https://github.com/pierremolinaro/acan2515.git
; Ajuste os pinos em include/node_config.h conforme a placa usada.
; Este ambiente representa a base ESP32 + MCP2515 legada.
