[platformio]
default_envs = papercolor

; Leitor da documentação no M5Stack PaperColor (ESP32-S3R8, 16 MB de flash,
; PSRAM octal, E Ink Spectra 6 de 400x600, M5PM1). Não faz parte da rede:
; mostra o README e os documentos de Documentacao/, gravados no firmware.
;
; tools/gerar_documentos.py converte os .md em src/documentos.h a cada
; compilação; para atualizar o texto do leitor, basta compilar e gravar de novo.
;   pio run              (ou Codigo/scripts/build_leitor.sh)
;   pio run -t upload    (ou Codigo/scripts/build_leitor.sh --upload <porta>)

[env:papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
extra_scripts = pre:tools/gerar_documentos.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -Wall
lib_deps =
    m5stack/M5Unified @ ^0.2.28
    m5stack/M5GFX @ ^0.2.35
