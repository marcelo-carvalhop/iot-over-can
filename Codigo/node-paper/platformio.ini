[platformio]
default_envs = papercolor

; Painel em papel eletrônico: M5Stack PaperColor (ESP32-S3R8, 16 MB de flash,
; PSRAM octal, E Ink Spectra 6 de 400x600, M5PM1).
;
; M5Unified/M5GFX reconhecem a placa (board_M5PaperColor) e exigem a PSRAM
; octal habilitada. A lógica do painel (src/panel_app.*) e a biblioteca
; Codigo/common/ioc_panel são as mesmas da bancada virtual.
; As chaves vêm de tools/paper_keys.py; use Codigo/scripts/build_paper.sh.

[env:papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
extra_scripts = pre:tools/paper_keys.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D IOT_OVER_CAN_PAPER=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -Wall
lib_deps =
    m5stack/M5Unified @ ^0.2.28
    m5stack/M5GFX @ ^0.2.35
    h2zero/NimBLE-Arduino @ ^2.5.1
    symlink://../common/ioc_link
    symlink://../common/ioc_panel
