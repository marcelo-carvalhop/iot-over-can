[platformio]
default_envs = cyd

; Painel na ESP32-2432S028 ("Cheap Yellow Display"): ESP32-WROOM-32 sem PSRAM,
; LCD de 2,8" 320x240 e toque resistivo XPT2046. A lógica do painel
; (src/panel_app.*) e a biblioteca Codigo/common/ioc_panel são as mesmas da
; bancada virtual; o HAL e a tela compacta ficam em src/cyd/. A versão com
; USB-C e micro-USB usa ST7789 (padrão); para a versão só com micro-USB,
; acrescente -D CYD_PANEL_ILI9341=1.
; As chaves vêm de tools/paper_keys.py; use Codigo/scripts/build_paper.sh.
;   pio run    (ou Codigo/scripts/build_paper.sh)
[env:cyd]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
extra_scripts = pre:tools/paper_keys.py
build_src_filter = +<panel_app.cpp> +<panel_signal.cpp> +<cyd/>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D IOT_OVER_CAN_CYD=1
    -Wall
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    h2zero/NimBLE-Arduino @ ^2.5.1
    symlink://../common/ioc_link
    symlink://../common/ioc_panel
