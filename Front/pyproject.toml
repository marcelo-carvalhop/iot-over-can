[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-over-can-tui"
version = "0.16.0"
description = "Console TUI de engenharia para supervisão, diagnóstico e configuração de redes IoT sobre CAN/CAN FD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual==8.2.8",
  "rich==15.0.0",
  "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7",
]

[project.scripts]
iot-over-can-tui = "pico_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pico_tui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.setuptools.package-data]
pico_tui = ["*.tcss"]
